name: splitsync
version: 1.0.0+1
description: SplitSync AI payment, shared bill, and store demo.
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  url_launcher: ^6.3.2
  http: ^1.2.2
  audioplayers: ^6.5.1
  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  local_auth: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/paypal.png
    - assets/products/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
